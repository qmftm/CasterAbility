# 기본 능력(classic) 자동 설치
#   처음 켤 때 plugins/Skript/scripts/CasterAbility/classic/ 에 능력 .sk 파일을 깔아둡니다.
#   classic 폴더가 이미 있으면 건드리지 않습니다.
#   처음 상태로 되돌리려면 그 폴더째 지우고 재시작하세요.
classic:
  install: true

game:
  basic_health: 20
  basic_level: 50
  auto_skip_second: 80
  ability_change_count: 3
  infinity_hunger: true
  infinity_duration: true
  cooldown_bow: false
  cooldown_shield: false
  weather_clear: false
  # 능력 사용 후 자동으로 거는 쿨타임을 이 비율(%)만큼 줄인다. 0~100.
  wreck: 0

spawn:
  # 이 이름의 월드 폴더(서버 루트)가 있으면 템플릿으로 보고, 게임마다
  # "<world_name>-game" 으로 통째로 복제해서 씁니다. 원본은 건드리지 않습니다.
  # 없으면 게임마다 "<world_name>-game" 을 새로 생성합니다.
  # 게임 월드는 게임이 끝날 때마다 통째로 지워집니다.
  world_name: casterability
  random_spawn: true
  random_radius: 100

death:
  drop_items: true
  drop_exp: false
  kick: false

invincibility:
  enable: true
  second: 90
  show_bossbar: true
  invisible: true

worldborder:
  enable: true
  max_radius: 500
  min_radius: 5
  shrink_second: 60
  shrink_count: 5
  shrink_random_center: true
  show_bossbar: true
